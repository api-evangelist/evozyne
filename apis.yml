aid: evozyne
name: Evozyne
description: 'Evozyne is an AI-native protein therapeutics company founded in 2020
  by Paragon Biosciences and headquartered in Chicago, Illinois. It combines generative
  machine learning with directed evolution and high-throughput biology to design de
  novo proteins — which it brands Natural Machines — and advance them as engineered
  protein therapeutics for immune-mediated diseases. The platform pairs AI protein
  design with wet-lab build-and-test cycles, and the company has collaborated with
  NVIDIA on model work and with the Gates Foundation on sustainability applications.
  Evozyne is a drug-discovery organization rather than a software vendor: it publishes
  a corporate website, a pipeline page, scientific publications and news, but no public
  API, developer portal, SDK or machine-readable specification of any kind.'
